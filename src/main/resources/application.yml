spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/lead_magnet}
    username: ${DATABASE_USERNAME:lead_magnet}
    password: ${DATABASE_PASSWORD:lead_magnet}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

app:
  auth:
    secret: ${AUTH_SECRET:replace-this-with-a-long-random-production-secret}
    token-hours: 12
  cors-origin: ${CORS_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
  seed-demo-data: ${SEED_DEMO_DATA:true}
