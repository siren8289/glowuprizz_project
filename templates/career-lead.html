<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>커리어 성장 뉴스레터 신청</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7fb; color: #172743; font-family: Arial, "Apple SD Gothic Neo", sans-serif; }
    main { width: min(100%, 680px); margin: 0 auto; padding: 48px 20px; }
    .issue { color: #546fbc; font-size: 13px; font-weight: 700; letter-spacing: .1em; }
    h1 { margin: 14px 0; font-size: clamp(34px, 8vw, 54px); line-height: 1.12; }
    .intro { color: #617087; font-size: 17px; line-height: 1.65; }
    .newsletter { margin-top: 28px; padding: 25px; border-radius: 18px; background: #243b6b; color: #fff; }
    .newsletter h2 { margin: 0; font-size: 20px; }
    .newsletter p { margin: 10px 0 0; color: #cbd7f3; line-height: 1.6; }
    .newsletter ol { margin: 21px 0 0; padding-left: 20px; color: #e6edff; line-height: 2; }
    form { margin-top: 18px; padding: 28px; border: 1px solid #dbe2f0; border-radius: 18px; background: #fff; }
    form h2 { margin: 0 0 7px; font-size: 21px; }
    label { display: block; margin-top: 16px; color: #3d4f6d; font-size: 14px; font-weight: 700; }
    input { width: 100%; margin-top: 7px; padding: 14px; border: 1px solid #ced8e9; border-radius: 9px; color: #172743; font: inherit; }
    input:focus { outline: 2px solid #9bb5ef; border-color: #4f72bf; }
    button { width: 100%; margin-top: 22px; padding: 15px; border: 0; border-radius: 9px; background: #355da8; color: #fff; font: 700 16px inherit; cursor: pointer; }
    small { display: block; margin-top: 14px; color: #758298; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="issue">CAREER INSIGHTS · WEEKLY</div>
    <h1>다음 기회를 위한<br>커리어 인사이트.</h1>
    <p class="intro">일하는 방식을 넓혀 주는 사례와 성장에 도움이 되는 실용적인 정보를 매주 전해드립니다.</p>
    <section class="newsletter">
      <h2>매주 받아보는 3가지</h2>
      <p>읽는 데 5분, 다음 행동을 정하는 데는 더 오래 도움이 되는 뉴스레터입니다.</p>
      <ol>
        <li>현업의 문제 해결 사례</li>
        <li>일과 성장에 관한 큐레이션</li>
        <li>바로 적용할 수 있는 질문 한 가지</li>
      </ol>
    </section>
    <form>
      <h2>뉴스레터 구독하기</h2>
      <label>이름<input name="name" autocomplete="name" required></label>
      <label>이메일<input name="email" type="email" autocomplete="email" required></label>
      <button type="submit">커리어 인사이트 받기</button>
      <small>구독은 언제든지 해지할 수 있습니다.</small>
    </form>
  </main>
</body>
</html>
